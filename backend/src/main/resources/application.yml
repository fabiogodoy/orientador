server:
  port: ${PORT:8080}
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
        secure: ${SESSION_COOKIE_SECURE:true}
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/desenv_orientador}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true
app:
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
